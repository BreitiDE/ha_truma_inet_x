write_parameter:
  fields:
    config_entry_id:
      selector:
        config_entry:
          integration: ha_truma_inet_x
    topic:
      required: true
      example: AirHeating
      selector:
        text:
    parameter:
      required: true
      example: TgtTemp
      selector:
        text:
    value:
      required: true
      example: 210
      selector:
        object:
    device:
      example: "0x0201"
      selector:
        text:

rediscover:
  fields:
    config_entry_id:
      selector:
        config_entry:
          integration: ha_truma_inet_x

dump_parameters:
  fields:
    config_entry_id:
      selector:
        config_entry:
          integration: ha_truma_inet_x

release_bluetooth:
  fields:
    config_entry_id:
      selector:
        config_entry:
          integration: ha_truma_inet_x
    minutes:
      example: 10
      selector:
        number:
          min: 0
          max: 1440
          unit_of_measurement: min
